/* ---------- STATE ---------- */
var expr="",lastExpr="",repCount=0,lastRoast="";
const pool=k=>cfg.lv>=1?R[k].concat(R[k+"S"]||[]):R[k];
function pick(k,sub){
 if(!sub&&["normal","simple","many","func","number"].includes(k)&&Math.random()<.7){lastRoast=gen();hist.push(lastRoast);if(hist.length>80)hist.shift();return lastRoast}
 let a=pool(k);let fresh=a.filter(x=>!hist.includes(x));if(!fresh.length){hist=[];fresh=a.slice()}
 let t=fresh[Math.floor(Math.random()*fresh.length)]||R[k][0];hist.push(t);if(hist.length>80)hist.shift();lastRoast=t;return sub?t.replace(/\bN\b/g,sub):t}
function say(t){const r=$("res");r.textContent=t;r.classList.remove("shake");void r.offsetWidth;r.classList.add("shake")}
function draw(){$("expr").textContent=expr||"0";$("expr").scrollLeft=1e6}
function analyse(s){const digits=(s.match(/\d/g)||[]).length,ops=(s.match(/[+−×÷^%!]/g)||[]).length,parens=(s.match(/[()]/g)||[]).length;
 return{digits,ops,parens,fn:/sin|cos|tan|log|ln|√|π|Ans/.test(s),zero:/÷\s*0(?![\d.])/.test(s),onlyNum:ops===0&&!/sin|cos|tan|log|ln|√|π|Ans/.test(s)&&digits>0&&parens===0}}
function payChance(base){const m=[.5,1,1.8][cfg.pay];return Math.random()<Math.min(1,base*m)}
function equals(){
 if(!expr){say(pick("empty"));return}
 if(expr===lastExpr)repCount++;else{repCount=1;lastExpr=expr}
 const a=analyse(expr);
 if(repCount>10){say(pick("repeat",String(repCount)));return}
 if(repCount>=5){say(REP[repCount]);return}
 if(repCount>=2&&Math.random()<.5){say(REP2[Math.floor(Math.random()*3)]);return}
 if(a.zero){say(pick("divzero"));return}
 if(a.digits>=9||a.ops>=5||a.parens>=5){say(pick("many"));if(payChance(.9))showPay();return}
 if(a.fn){say(pick("func"));if(payChance(.3))showPay();return}
 if(a.onlyNum){say(pick("number"));return}
 if(a.digits<=3&&a.ops<=1){say(pick("simple"));return}
 say(pick("normal"));if(payChance(.35))showPay()}
function showPay(){$("mtxt").textContent=pick("payline");$("modal").classList.add("show")}
$("bPay").onclick=()=>{$("modal").classList.remove("show");say(pick("payNow"));setTimeout(()=>say(pick("paySecond")),1800)};
$("bNo").onclick=()=>{$("modal").classList.remove("show");say(pick("nevermind"))};
$("bDone").onclick=()=>$("set").classList.remove("show");
document.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{expr+=b.dataset.i;draw()});
document.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>{
 const k=b.dataset.k;
 if(k==="AC"){expr="";repCount=0;lastExpr="";draw();say(pick("reset"))}
 else if(k==="DEL"){expr=expr.replace(/(sin\(|cos\(|tan\(|log\(|ln\(|√\(|Ans|.)$/,"");draw()}
 else if(k==="EQ")equals();
 else if(k==="SHIFT"||k==="ALPHA"){$(k==="SHIFT"?"iS":"iA").classList.toggle("on");say(pick("shift").split(". ")[k==="SHIFT"?0:1]||pick("shift"))}
 else if(k==="MODE"){cfg.lv=(cfg.lv+1)%4;save();say(LV[cfg.lv].toUpperCase()+" ROASTS ON.")}
 else if(k==="SETUP"){ui();$("set").classList.add("show")}
 else if(k==="ON")say(pick("empty"))});
addEventListener("keydown",e=>{const m={"*":"×","/":"÷","-":"−"};
 if($("set").classList.contains("show"))return;
 if(/^[0-9.+()^%!]$/.test(e.key)||m[e.key]){expr+=m[e.key]||e.key;draw()}
 else if(e.key==="Enter"||e.key==="="){e.preventDefault();equals()}
 else if(e.key==="Backspace"){expr=expr.slice(0,-1);draw()}
 else if(e.key==="Escape"){expr="";draw();say(pick("reset"))}});
apply();draw();
</script></body></html>
